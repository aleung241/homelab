services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.5
    container_name: immich-server
    user: ${DEFAULT_USER}:${DEFAULT_GROUP}
    depends_on:
      - immich-redis
      - immich-database
    environment:
      DB_HOSTNAME: immich-database
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_URL: ${IMMICH_MACHINE_LEARNING_URL}
    volumes:
      - ${DOCKER_DIRECTORY_BASE_PATH}/immich/data:/data
      - ${SERVER_STORAGE_BASE_PATH}/immich:/data/library
      - ${TRANSCODE_BASE_PATH}/immich/upload:/data/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    healthcheck:
      disable: false
    extends:
      file: common.yaml
      service: common

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    container_name: immich-redis
    healthcheck:
      test: redis-cli ping || exit 1
    extends:
      file: common.yaml
      service: common

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DOCKER_DIRECTORY_BASE_PATH}/immich/postgres:/var/lib/postgresql/data
    healthcheck:
      disable: false
    shm_size: 128mb
    extends:
      file: common.yaml
      service: common