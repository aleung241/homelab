services:
  portainer:
    image: portainer/portainer-ce:2.45.2
    container_name: portainer
    environment:
      TZ: ${TIMEZONE}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DIRECTORY_BASE_PATH}/portainer:/data
    ports:
      - "8100:8000"
      - "9000:9000"
      - "9443:9443"
    extends:
      file: common.yaml
      service: common

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.2
    container_name: home-assistant
    privileged: true
    volumes:
      - ${DOCKER_DIRECTORY_BASE_PATH}/home-assistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    ports:
      - "8123:8123"
    extends:
      file: common.yaml
      service: common

  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.9
    container_name: changedetection
    depends_on:
      sockpuppetbrowser:
        condition: service_started
    environment:
      PLAYWRIGHT_DRIVER_URL: ws://sockpuppetbrowser:3000
      HIDE_REFERER: true
      FETCH_WORKERS: 10
      PUID: ${DEFAULT_USER}
      PGID: ${DEFAULT_GROUP}
      ALLOW_IANA_RESTRICTED_ADDRESSES: true
    volumes:
      - ${DOCKER_DIRECTORY_BASE_PATH}/changedetection/datastore:/datastore
    ports:
      - "5001:5000"
    extends:
      file: common.yaml
      service: common

  sockpuppetbrowser:
    image: dgtlmoon/sockpuppetbrowser@sha256:1d8f72d2ce2085faed4232e5ae1e65c02efe5b831a18e127829b267c260b4fb2
    container_name: sockpuppetbrowser
    cap_add:
      - SYS_ADMIN
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=10
    extends:
      file: common.yaml
      service: common
