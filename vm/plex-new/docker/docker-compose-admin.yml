services:
  portainer_agent:
    image: portainer/agent:2.45.2
    container_name: portainer_agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9001:9001"
    extends:
      file: common.yaml
      service: common

  drydock-agent:
    image: codeswhat/drydock:1.7.0
    container_name: drydock-agent
    command: --agent
    environment:
      TZ: ${TIMEZONE}
      DD_AGENT_SECRET: ${DRYDOCK_AGENT_SECRET}
      DD_WATCHER_PLEX_HOST: drydock-socket-proxy
      DD_WATCHER_PLEX_PORT: "2375"
      DD_WATCHER_PLEX_MATURITY_MODE: mature
      DD_WATCHER_PLEX_MATURITY_MIN_AGE_DAYS: "7"
      # All things docker registries
      DD_REGISTRY_HUB_PUBLIC_LOGIN: ${DRYDOCK_HUB_LOGIN}
      DD_REGISTRY_HUB_PUBLIC_TOKEN: ${DRYDOCK_HUB_TOKEN}
      DD_REGISTRY_GHCR_PUBLIC_USERNAME: ${DRYDOCK_GITHUB_USER}
      DD_REGISTRY_GHCR_PUBLIC_TOKEN: ${DRYDOCK_GITHUB_TOKEN}
      DD_REGISTRY_LSCR_PUBLIC_USERNAME: ${DRYDOCK_GITHUB_USER}
      DD_REGISTRY_LSCR_PUBLIC_TOKEN: ${DRYDOCK_GITHUB_TOKEN}
      DD_RELEASE_NOTES_GITHUB_TOKEN: ${DRYDOCK_GITHUB_TOKEN}
    ports:
      - "3000:3000"
    volumes:
      - ${DOCKER_DIRECTORY_BASE_PATH}:/opt/docker:ro
    depends_on:
      drydock-socket-proxy:
        condition: service_healthy
    extends:
      file: common.yaml
      service: common

  drydock-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: drydock-socket-proxy
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      EVENTS: "1"
      SERVICES: "1"
      INFO: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: wget --spider http://localhost:2375/version || exit 1
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    extends:
      file: common.yaml
      service: common
